[workspace]
resolver = "2"
# One workspace for the on-chain and off-chain parts. Only programs/propamm-vault
# is built for BPF; the rest are host crates, cargo-build-sbf does not touch them.
members = ["crates/*", "programs/*", "tests/e2e", "tests/program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/PropAMMForge/PropAMM-Forge"

# The versions here are the single source of truth for the whole workspace.
#
# jupiter-amm-interface asks for solana crates as ">=2", i.e. with no upper bound.
# Anchor 1.2.0 asks for "^3.0.0"…"^3.1.0". The ranges are compatible, cargo resolves
# them to one triple — there is no conflict. The danger is the open range itself: a
# third party's minor release arrives on its own and stops the build with an error
# inside a foreign crate. So Cargo.lock is committed and is the pin, and bumping the
# solana crates is a deliberate act with a test re-run, not a side effect of `cargo update`.
[workspace.dependencies]
anchor-lang = "1.2.0"
anchor-spl = "1.2.0"
jupiter-amm-interface = "0.6.1"

# `spl-token-2022` is NO LONGER NEEDED here and must not be added: anchor-spl
# 1.2.0 works through `spl-token-2022-interface` and re-exports it as
# `anchor_spl::token_2022::spl_token_2022`. Two crates at once would give two
# incompatible sets of `ExtensionType`, and the FR-005 check would compare against
# something other than what the token program sees. T013 decision, replacing the pin from PLAN.md.

mollusk-svm = "0.15.1"
mollusk-svm-bencher = "0.15.1"
mollusk-svm-programs-token = "0.15.1"
proptest = "1.11"

# The Mollusk harness lives on FOURTH-generation solana crates, while anchor-lang
# is on the third. This is not a resolver mistake: `solana-pubkey` is present in
# Cargo.lock twice (3.0.0 under Anchor, 4.2.1 under Mollusk), and the two `Pubkey`s
# are NOT compatible with each other. Tests convert keys via `to_bytes()` — see `tests/program`.
# `solana-instruction` is meanwhile single (3.4.1) and links against pubkey 4.2.1 itself.
#
# The on-chain build is unaffected: the crates below are dependencies of the test
# crate, programs/propamm-vault has none of them.
solana-account = "4.3"
solana-instruction = "3.4"
solana-program-error = "3.0"
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-pubkey = "4.2"
solana-svm-log-collector = "4.2"

# Parsing the `Program data:` line from the log — otherwise the T018 events cannot be read.
base64 = "0.22"
propamm-quote = { path = "crates/propamm-quote" }

# CLI. This whole group lives on THIRD-generation solana crates — the same ones
# anchor-lang is on — so `Pubkey`, `Instruction` and `Message` in the CLI are one
# type and no `to_bytes` crossing is needed here (unlike the tests, where Mollusk
# on the fourth generation sits alongside). Verified by building the CLI.
#
# `solana-client` is DELIBERATELY not taken (T023 decision): it pulls in almost the
# whole agave stack — +378 crates versus +80 here — while of its forty methods
# `forge` needs six, and instructions are assembled via `anchor_lang::InstructionData` anyway.
# One more point of contact with that stack would mean one more open version
# range next to `jupiter-amm-interface`, which asks for solana crates as ">=2".
# Verified with the resolver: none of the options moves `solana-pubkey` 3.0.0.
clap = "4"
dirs = "7"
solana-hash = "3.1"
solana-keypair = "3.1"
solana-message = { version = "3.1", features = ["bincode", "serde"] }
solana-signer = "3.0"
solana-transaction = { version = "3.1", features = ["bincode", "serde", "verify"] }
tempfile = "3"
toml = "1"

# HTTP to the node. rustls instead of system TLS: the build has to pass the same
# way in WSL and on Windows.
ureq = "3"

# The transaction is serialized with bincode — that is Solana's wire format, not our choice.
bincode = "1.3"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# Tests and CU benchmarks must be close to the release build in arithmetic,
# otherwise the measured numbers do not carry over to what really goes to the network.
[profile.test]
overflow-checks = true
