name: Pages

# Publishes the landing page (`apps/landing`, static, no build) at the site root
# and `apps/web` — the console prototype on mock data — under `app/`.
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
# Without it the deploy job fails with "Resource not accessible" on the first run.
#
# The site is a project site, so it lives under `/<repo>/` and the console under
# `/<repo>/app/`. That base path is derived from the repository name here and
# handed to Vite as BASE_PATH; the router reads the same value back through
# `import.meta.env.BASE_URL`.

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'apps/landing/**'
      - 'packages/sdk/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels the one in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the console
        env:
          BASE_PATH: /${{ github.event.repository.name }}/app/
        run: pnpm --filter @propamm/web build

      # One artifact, two folders: the landing at the root, the console in app/.
      # The landing is copied as it is — it has no build step.
      #
      # Pages has no SPA fallback, and it serves a custom 404 only from the site
      # root — `app/404.html` would be ignored. So the root 404.html is the
      # console's own shell: a direct hit on `/<repo>/app/vaults` gets it and the
      # router takes over (the status code is still 404, fine for a prototype).
      # A path outside `app/` would start the console with a basename that does
      # not match — an empty screen — so the shell first sends those to the landing.
      - name: Assemble the site
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p site
          cp -r apps/landing/. site/
          cp -r apps/web/dist site/app
          guard="<script>if(location.pathname.indexOf('/${REPO}/app/')!==0)location.replace('/${REPO}/')</script>"
          sed "s|<head>|<head>${guard}|" apps/web/dist/index.html > site/404.html
          grep -qF "$guard" site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
