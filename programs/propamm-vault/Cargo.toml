[package]
name = "propamm-vault"
description = "PropAMM on-chain program: a vault for one pair with the quote inside the account"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `cdylib` is what goes to the network; `lib` is needed so the crate is visible from
# the tests (Mollusk, T020), the adapter (T034) and the CLI. Without the second entry
# the `Vault` layout would exist in two copies — here and in whoever reads it — and
# that is exactly the way to diverge that SC-006 forbids.
[lib]
crate-type = ["cdylib", "lib"]
name = "propamm_vault"

# The feature set is the standard Anchor one and not cosmetic:
# `no-entrypoint` disables the BPF entry point when the crate is linked as a library;
# `idl-build` enables `anchor build --features idl-build`, which the CLI extracts the IDL with.
#
# `custom-heap`, `custom-panic` and `anchor-debug` are not enabled, but they have to
# be declared here: the `#[program]` macro expands into `cfg(feature = "...")` on
# them, and an unexpected cfg is a warning since rustc 1.80. The gate runs with
# `-D warnings`, so an unexpected cfg would stop the build.
[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

# The same, but for `cfg(target_os = "solana")`: the host rustc does not know such
# a platform, while Anchor expands into it. Declaring the value removes the warning
# without disabling the cfg check itself for the rest of the code.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang.workspace = true

# The quote math — the same crate the router adapter reads.
# `no_std` and free of Solana dependencies, so it builds the same for BPF and for the host.
propamm-quote = { path = "../../crates/propamm-quote" }
